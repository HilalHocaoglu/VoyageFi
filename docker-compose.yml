services:
  db:
    image: pgvector/pgvector:pg16  # pgvector eklentisini içeren resmi PostgreSQL imajı
    container_name: voyagefi_postgres
    env_file:
      - .env
    ports:
      - "5433:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: voyagefi_redis
    ports:
      - "6379:6379"
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: voyagefi_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

volumes:
  postgres_data: